<title>Battlegrounds Anim Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #eef0f3;
    --panel: #ffffff;
    --ink: #1b2230;
    --muted: #5b6576;
    --line: #d5dae2;
    --accent: #2f6fd6;
    --accent-ink: #ffffff;
    --chip: #e4e8ee;
    --stage: #1d222a;
    --tick: #9aa6b8;
    --display: "Russo One", "Arial Black", Arial, sans-serif;
    --body: "Barlow", "Segoe UI", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #12161d; --panel: #1a2029; --ink: #e6eaf0; --muted: #95a0b2;
      --line: #2a3240; --accent: #6a9bf0; --accent-ink: #0d1320; --chip: #232b37;
      --stage: #0f1319; --tick: #5f6b7e;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #12161d; --panel: #1a2029; --ink: #e6eaf0; --muted: #95a0b2;
    --line: #2a3240; --accent: #6a9bf0; --accent-ink: #0d1320; --chip: #232b37;
    --stage: #0f1319; --tick: #5f6b7e;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px;
    padding-inline: 16px; padding-block: 14px; box-sizing: border-box;
  }
  .app { display: grid; grid-template-columns: 230px 1fr; gap: 14px; height: 100%; max-width: 1400px; margin: 0 auto; }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; letter-spacing: 0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
  .group-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; margin: 2px 6px 4px; }
  .list { display: flex; flex-direction: column; gap: 2px; }
  .anim {
    all: unset; cursor: pointer; display: flex; justify-content: space-between; gap: 8px;
    padding: 7px 8px; border-radius: 5px; font-weight: 500;
  }
  .anim span { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .anim:hover { background: var(--chip); }
  .anim:focus-visible { outline: 2px solid var(--accent); }
  .anim[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .anim[aria-pressed="true"] span { color: var(--accent-ink); opacity: 0.8; }
  main { display: grid; grid-template-rows: 1fr auto; gap: 10px; min-height: 0; }
  .stage { position: relative; background: var(--stage); border-radius: 8px; overflow: hidden; min-height: 320px; }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; left: 12px; top: 10px; font-family: var(--mono); font-size: 12px; color: #c9d2e0; line-height: 1.5; pointer-events: none; }
  .hud b { font-family: var(--display); font-weight: 400; font-size: 16px; color: #fff; display: block; }
  .cams { position: absolute; right: 10px; top: 10px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
  .cams button { font: 500 12px var(--body); border: 0; border-radius: 4px; padding: 5px 8px; background: rgba(255,255,255,0.1); color: #dfe6f1; cursor: pointer; }
  .cams button:hover { background: rgba(255,255,255,0.2); }
  .hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: #e6ebf3; text-shadow: 0 1px 2px #000; pointer-events: none; }
  .transport { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    font: 600 14px var(--body); border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    border-radius: 5px; padding: 6px 11px; cursor: pointer; min-width: 38px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible, .cams button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-width: 78px; }
  .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }
  .readout { margin-left: auto; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .timeline { position: relative; height: 34px; cursor: pointer; touch-action: none; }
  .track { position: absolute; left: 0; right: 0; top: 15px; height: 4px; border-radius: 2px; background: var(--chip); }
  .seg { position: absolute; top: 9px; height: 16px; border-left: 2px solid var(--tick); }
  .seg.on { background: color-mix(in srgb, var(--accent) 22%, transparent); border-left-color: var(--accent); }
  .head { position: absolute; top: 3px; width: 2px; height: 28px; background: var(--accent); pointer-events: none; }
  .notes { color: var(--muted); font-size: 13px; margin: 0; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; height: auto; }
    aside { max-height: none; }
    .list { flex-direction: row; flex-wrap: wrap; }
    .stage { height: 60vh; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="app">
  <header>
    <h1>Battlegrounds Anim Viewer</h1>
    <p>Every animation on an R6 rig, played in real time with constant easing, the same way Roblox plays it.</p>
  </header>
  <aside>
    <div>
      <div class="group-label">Dashes</div>
      <div class="list" id="list-dash"></div>
    </div>
    <div>
      <div class="group-label">Movement, parkour, Moth, M1</div>
      <div class="list" id="list-move"></div>
    </div>
  </aside>
  <main>
    <div class="stage" id="stage">
      <div class="hud" id="hud"></div>
      <div class="cams" id="cams"></div>
      <div class="hint">Drag to orbit · scroll or pinch to zoom · right-drag to pan</div>
    </div>
    <div class="transport">
      <div class="row">
        <button class="btn primary" id="play">Pause</button>
        <button class="btn" id="prev" title="Previous pose (,)">◀ Pose</button>
        <button class="btn" id="next" title="Next pose (.)">Pose ▶</button>
        <span class="sep"></span>
        <span class="label">Speed</span>
        <span class="row" id="speeds"></span>
        <span class="sep"></span>
        <button class="btn" id="loop" aria-pressed="true">Loop</button>
        <button class="btn" id="travel" aria-pressed="false">Move with it</button>
        <span class="readout" id="readout"></span>
      </div>
      <div class="timeline" id="timeline"><div class="track"></div><div class="head" id="playhead"></div></div>
      <p class="notes" id="notes"></p>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const DATA = __DATA__;
// Studs travelled by the character while an animation plays (from MovementConfig), for "Move with it".
const TRAVEL = {
  DashForward: { dir: [0, 0, -1], dist: 25, time: 0.45 },
  DashBack: { dir: [0, 0, 1], dist: 17.5, time: 0.34 },
  DashRight: { dir: [1, 0, 0], dist: 17.5, time: 0.34 },
  DashLeft: { dir: [-1, 0, 0], dist: 17.5, time: 0.34 },
  DashPunch: { dir: [0, 0, -1], dist: 5, time: 0.16 },
  WalkForward: { dir: [0, 0, -1], speed: 14 },
  Sprint: { dir: [0, 0, -1], speed: 26 },
};
const SIZES = { Torso: [2, 2, 1], Head: [1.25, 1.25, 1.25], "Right Arm": [1, 2, 1], "Left Arm": [1, 2, 1], "Right Leg": [1, 2, 1], "Left Leg": [1, 2, 1] };
const COLORS = { Torso: 0x2f6fd6, Head: 0xf5cd30, "Right Arm": 0xf5cd30, "Left Arm": 0xf5cd30, "Right Leg": 0x4b974b, "Left Leg": 0x4b974b };

let anim = null, t = 0, playing = true, speed = 1, loop = true, travel = false, lastPose = -1;

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d222a);
scene.fog = new THREE.Fog(0x1d222a, 40, 110);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 2.6, 0);

scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x303642, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(6, 12, 8);
scene.add(sun);

// Baseplate: grey slab with a stud-spaced grid (1 stud squares, bolder every 4).
const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x5c636e }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const grid1 = new THREE.GridHelper(400, 400, 0x707885, 0x707885); grid1.position.y = 0.005; scene.add(grid1);
const grid4 = new THREE.GridHelper(400, 100, 0x9aa3b0, 0x9aa3b0); grid4.position.y = 0.01; scene.add(grid4);

// The rig: six boxes, each placed straight from the exported world matrix of the pose.
const rig = new THREE.Group();
scene.add(rig);
const parts = {};
for (const name of Object.keys(SIZES)) {
  const [x, y, z] = SIZES[name];
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(x, y, z), new THREE.MeshLambertMaterial({ color: COLORS[name] }));
  mesh.matrixAutoUpdate = false;
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), new THREE.LineBasicMaterial({ color: 0x1a1a1a }));
  mesh.add(edges);
  rig.add(mesh);
  parts[name] = mesh;
}
// Face on the front (-Z) of the head so facing is obvious from any angle.
const face = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.28, 0.06), new THREE.MeshBasicMaterial({ color: 0x1a1a1a }));
face.position.set(0, 0.12, -0.64);
parts.Head.add(face);
// Arrow on the floor pointing where the character faces.
const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, 0.03, 0), 3, 0xf5cd30, 0.6, 0.4);
rig.add(arrow);
const shadow = new THREE.Mesh(new THREE.CircleGeometry(1.4, 24), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 }));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.02; rig.add(shadow);

const m4 = new THREE.Matrix4();
function applyPose(i) {
  const key = anim.keys[i];
  for (const [name, arr] of Object.entries(key.parts)) {
    m4.fromArray(arr);
    parts[name].matrix.copy(m4);
  }
}

// Which pose shows at time `time`: each pose holds from its own key until the next key.
function poseIndexAt(time) {
  const keys = anim.keys;
  let i = 0;
  for (let k = 0; k < keys.length - 1; k++) if (time >= keys[k].t) i = k;
  return i;
}
function length() { return anim.keys[anim.keys.length - 1].t; }
function poseCount() { return anim.keys.length - 1; }

function travelOffset(time) {
  const tr = TRAVEL[anim.name];
  if (!travel || !tr) return 0;
  if (tr.speed) return tr.speed * time;
  const u = Math.min(time, tr.time);
  const v0 = (2 * tr.dist) / tr.time; // speed falls in a straight line to 0 over the dash
  return v0 * u - (v0 / tr.time) * u * u / 2;
}

const listDash = document.getElementById("list-dash");
const listMove = document.getElementById("list-move");
const buttons = {};
DATA.forEach((a, idx) => {
  const b = document.createElement("button");
  b.className = "anim"; b.type = "button"; b.id = "anim-" + a.name;
  b.innerHTML = `${a.name}<span>${(a.keys.length - 1)}p · ${a.keys[a.keys.length - 1].t.toFixed(2)}s</span>`;
  b.addEventListener("click", () => select(idx));
  (a.name.startsWith("Dash") ? listDash : listMove).appendChild(b);
  buttons[a.name] = b;
});

const timeline = document.getElementById("timeline");
const playhead = document.getElementById("playhead");
function buildTimeline() {
  timeline.querySelectorAll(".seg").forEach((e) => e.remove());
  const L = length();
  for (let k = 0; k < anim.keys.length - 1; k++) {
    const s = document.createElement("div");
    s.className = "seg"; s.dataset.i = k;
    s.style.left = (anim.keys[k].t / L) * 100 + "%";
    s.style.width = ((anim.keys[k + 1].t - anim.keys[k].t) / L) * 100 + "%";
    timeline.appendChild(s);
  }
}

function select(idx) {
  anim = DATA[idx];
  t = 0; lastPose = -1;
  for (const [n, b] of Object.entries(buttons)) b.setAttribute("aria-pressed", String(n === anim.name));
  loop = anim.loop || anim.name.startsWith("Dash");
  document.getElementById("loop").setAttribute("aria-pressed", String(loop));
  document.getElementById("notes").textContent = anim.notes;
  buildTimeline();
  try { localStorage.setItem("anim", anim.name); } catch (e) {}
}

// Speed chips.
const speedsEl = document.getElementById("speeds");
[0.1, 0.25, 0.5, 1].forEach((s) => {
  const b = document.createElement("button");
  b.className = "btn"; b.type = "button"; b.id = "speed-" + s; b.textContent = s + "×";
  b.setAttribute("aria-pressed", String(s === 1));
  b.addEventListener("click", () => {
    speed = s;
    speedsEl.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  });
  speedsEl.appendChild(b);
});

const playBtn = document.getElementById("play");
function setPlaying(p) { playing = p; playBtn.textContent = p ? "Pause" : "Play"; }
playBtn.addEventListener("click", () => {
  if (!playing && !loop && t >= length()) t = 0;
  setPlaying(!playing);
});
function step(d) {
  setPlaying(false);
  const n = poseCount();
  const i = (poseIndexAt(t) + d + n) % n;
  t = anim.keys[i].t + 1e-4;
}
document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
document.getElementById("loop").addEventListener("click", (e) => {
  loop = !loop; e.currentTarget.setAttribute("aria-pressed", String(loop));
});
document.getElementById("travel").addEventListener("click", (e) => {
  travel = !travel; e.currentTarget.setAttribute("aria-pressed", String(travel));
});

function scrub(ev) {
  const r = timeline.getBoundingClientRect();
  const f = Math.min(Math.max((ev.clientX - r.left) / r.width, 0), 0.9999);
  t = f * length();
  setPlaying(false);
}
timeline.addEventListener("pointerdown", (ev) => {
  timeline.setPointerCapture(ev.pointerId); scrub(ev);
  const move = (e) => scrub(e);
  const up = () => { timeline.removeEventListener("pointermove", move); timeline.removeEventListener("pointerup", up); };
  timeline.addEventListener("pointermove", move); timeline.addEventListener("pointerup", up);
});

// Camera presets (the character faces -Z; "Behind" is how you see it in game).
const CAMS = {
  Behind: [0, 5, 15], Front: [0, 4, -15], Left: [-15, 4, 0], Right: [15, 4, 0],
  "3/4": [10.5, 6.5, 11.5], Top: [0.01, 19, 0.01],
};
const camsEl = document.getElementById("cams");
function setCam(name) {
  const [x, y, z] = CAMS[name];
  const c = controls.target;
  camera.position.set(c.x + x, y, c.z + z);
  controls.target.set(c.x, 2.4, c.z);
}
Object.keys(CAMS).forEach((n, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = `${n}`; b.title = `Camera: ${n} (${i + 1})`;
  b.addEventListener("click", () => setCam(n));
  camsEl.appendChild(b);
});

window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); playBtn.click(); }
  else if (e.key === ",") step(-1);
  else if (e.key === ".") step(1);
  else if (/^[1-6]$/.test(e.key)) setCam(Object.keys(CAMS)[+e.key - 1]);
});

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

const hud = document.getElementById("hud");
const readout = document.getElementById("readout");
let prevTime = performance.now();
const followed = new THREE.Vector3();
function frame(now) {
  const dt = Math.min((now - prevTime) / 1000, 0.1);
  prevTime = now;
  const L = length();
  if (playing) {
    t += dt * speed;
    if (t >= L) {
      if (loop) t = anim.loop ? t % L : (t >= L + 0.35 ? 0 : t); // one-shots pause a beat on the last pose
      else { t = L - 1e-4; setPlaying(false); }
    }
  }
  const tt = Math.min(t, L - 1e-4);
  const i = poseIndexAt(tt);
  if (i !== lastPose) { applyPose(i); lastPose = i; }

  // Travel: slide the whole rig, and keep the camera's target on it.
  const tr = TRAVEL[anim.name];
  const off = travelOffset(anim.loop ? tt : Math.min(t, L));
  const dir = tr ? tr.dir : [0, 0, 0];
  const before = rig.position.clone();
  rig.position.set(dir[0] * off, 0, dir[2] * off);
  const moved = rig.position.clone().sub(before);
  camera.position.add(moved);
  controls.target.add(moved);

  playhead.style.left = `calc(${(tt / L) * 100}% - 1px)`;
  timeline.querySelectorAll(".seg").forEach((s) => s.classList.toggle("on", +s.dataset.i === i));
  hud.innerHTML = `<b>${anim.name}</b>pose ${i + 1} / ${poseCount()} · shows ${anim.keys[i].t.toFixed(2)}–${anim.keys[i + 1].t.toFixed(2)}s`;
  readout.textContent = `${tt.toFixed(2)} / ${L.toFixed(2)} s`;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

let start = 0;
try { const saved = localStorage.getItem("anim"); const k = DATA.findIndex((a) => a.name === saved); if (k >= 0) start = k; } catch (e) {}
if (start === 0) start = Math.max(0, DATA.findIndex((a) => a.name === "DashRight"));
select(start);
setCam("3/4");
resize();
requestAnimationFrame(frame);
</script>
